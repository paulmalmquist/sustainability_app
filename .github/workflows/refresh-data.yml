name: Refresh market data

# Pulls public market data every Monday, rebuilds the Claude skill with it,
# runs the tests, commits the result to main, and republishes the site.
on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/data/requirements.txt
      - run: pip install -r scripts/data/requirements.txt
      - name: Fetch public market data
        env:
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
          NREL_API_KEY: ${{ secrets.NREL_API_KEY }}
        run: python scripts/data/refresh.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:skill
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit refreshed data
        id: commit
        run: |
          git add src/data skill
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Refresh market data ($(date -u +%F))"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN don't start other workflows, so publish here.
      - name: Publish dist/ to the gh-pages branch
        if: steps.commit.outputs.changed == 'true'
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish ${GITHUB_SHA::7} with refreshed market data"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
